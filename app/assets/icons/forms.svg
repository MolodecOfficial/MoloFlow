<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="384" height="512">
  <defs>
    <!-- Тень под загнутым уголком -->
    <path id="corner-fold" d="M256 0 L384 128 L256 128 Z" />
    <filter id="fold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Основное тело листа -->
  <path d="M48 0 H256 L384 128 V464 C384 490.5 362.5 512 336 512 H48 C21.5 512 0 490.5 0 464 V48 C0 21.5 21.5 0 48 0 Z" fill="#7C3AED" />

  <!-- Загнутый уголок -->
  <path d="M256 0 V96 C256 113.7 270.3 128 288 128 H384 Z" fill="#A78BFA" filter="url(#fold-shadow)" />

  <!-- Символ бланка/накладной (белый) -->
  <g fill="#FFFFFF">
    <!-- Позиция 1: маркер и строка товара -->
    <rect x="96" y="234" width="22" height="22" rx="4" />
    <rect x="134" y="238" width="154" height="14" rx="4" />

    <!-- Позиция 2: маркер и строка товара -->
    <rect x="96" y="282" width="22" height="22" rx="4" />
    <rect x="134" y="286" width="154" height="14" rx="4" />

    <!-- Позиция 3: маркер и короткая строка (сумма/итог) -->
    <rect x="96" y="330" width="22" height="22" rx="4" />
    <rect x="134" y="334" width="96" height="14" rx="4" />

    <!-- Нижняя разделительная черта итогов -->
    <rect x="96" y="380" width="192" height="6" rx="3" opacity="0.6" />
  </g>
</svg>
